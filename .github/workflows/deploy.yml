name: Deploy Shopkeeper to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # CI গেট (P2) — এই job ফেল করলে deploy job চলবেই না
  gate:
    runs-on: ubuntu-latest
    name: tsc + lint + test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Pages
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Generate runtime env (bakes secrets into edge bundle)
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_ID: ${{ secrets.CLOUDFLARE_KV_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          SHADOW_WRITE_D1: ${{ vars.SHADOW_WRITE_D1 }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > src/lib/generatedEnv.ts <<EOF
          // ⚙️ AUTO-GENERATED at build — placeholder is committed, this one is not
          export const GENERATED_ENV: Record<string, string> = {
          ADMIN_PASSWORD: "${ADMIN_PASSWORD}",
          CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID}",
            CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN}",
            CLOUDFLARE_KV_ID: "${CLOUDFLARE_KV_ID}",
            D1_DATABASE_ID: "${D1_DATABASE_ID}",
            SHADOW_WRITE_D1: "${SHADOW_WRITE_D1}",
            CRON_SECRET: "${CRON_SECRET}",
            GEMINI_API_KEY: "${GEMINI_API_KEY}",
          };
          EOF
          echo "generatedEnv.ts written"

      - name: Build Next.js with Cloudflare Adapter
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_ID: ${{ secrets.CLOUDFLARE_KV_ID }}
        run: npx @cloudflare/next-on-pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=shopkeeperbd --branch=main
